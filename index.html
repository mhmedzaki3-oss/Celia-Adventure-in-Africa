<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مغامرات سيليا</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #ffe4e1; padding: 20px; }
        h1 { color: #FF1493; }
        .screen { display: none; }
        .active { display: block; }
        button { padding: 15px; font-size: 18px; background: #4CAF50; color: white; border: none; border-radius: 10px; margin: 10px; width: 80%; cursor: pointer; }
        .btn-blue { background: #3498db; }
        .btn-orange { background: #f39c12; }
        .btn-pink { background: #FF1493; }
    </style>
</head>
<body>

    <!-- الشاشة الرئيسية -->
    <div id="home" class="screen active">
        <h1>مغامرات سيليا وسندباد</h1>
        <p>مرحباً بك! جرب الأزرار:</p>
        <button onclick="showScreen('game')">🌳 ابدأ المغامرة</button>
        <button class="btn-blue" onclick="alert('هذه هي موسوعة الحيوانات!')">🦁 اكتشف الحيوانات</button>
        <button class="btn-orange" onclick="alert('اسمع صوت الأسد: زئير!')">🔊 اسمع الأصوات</button>
        <button class="btn-pink" onclick="showScreen('stars')">⭐ نجومي</button>
    </div>

    <!-- شاشة اللعب -->
    <div id="game" class="screen">
        <h2>من هو ملك الغابة؟</h2>
        <button onclick="checkAnswer('الأسد')">الأسد</button>
        <button onclick="checkAnswer('الفيل')">الفيل</button>
        <button onclick="checkAnswer('الزرافة')">الزرافة</button>
        <button class="btn-pink" onclick="showScreen('home')">العودة للرئيسية</button>
    </div>

    <!-- شاشة النجوم -->
    <div id="stars" class="screen">
        <h2>نجومي ⭐</h2>
        <p style="font-size: 30px;" id="star-count">0</p>
        <button class="btn-pink" onclick="showScreen('home')">العودة للرئيسية</button>
    </div>

    <script>
        // دالة التنقل بين الشاشات
        function showScreen(screenId) {
            // إخفاء كل الشاشات
            var screens = document.querySelectorAll('.screen');
            for (var i = 0; i < screens.length; i++) {
                screens[i].classList.remove('active');
            }
            // إظهار الشاشة المطلوبة
            document.getElementById(screenId).classList.add('active');
        }

        // دالة التحقق من الإجابة
        var stars = 0;
        function checkAnswer(answer) {
            if (answer === 'الأسد') {
                alert("إجابة صحيحة! أحسنت ⭐");
                stars++;
                document.getElementById('star-count').innerText = stars;
                showScreen('home'); // العودة للرئيسية بعد الإجابة
            } else {
                alert("إجابة خاطئة، حاول مرة أخرى!");
            }
        }
    </script>
</body>
</html>
